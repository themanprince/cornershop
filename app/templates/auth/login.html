{% extends "base.html" %}
{% block title %}Sign in · Cornershop{% endblock %}
{% block content %}
  <div class="card shadow-sm mx-auto my-4 login-card">
    <div class="card-body p-4 text-center">
      <h1 class="h4 mb-2">Welcome to Cornershop</h1>
      <p class="text-muted mb-4">Sign in with your Google account to continue.</p>
      <a href="/auth/google" class="btn btn-primary btn-lg w-100">Sign in with Google</a>
      <p class="small text-muted mt-3 mb-0">New here? Signing in creates your account.</p>
    </div>
  </div>
{% endblock %}
