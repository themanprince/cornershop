{% extends "base.html" %}
{% block title %}{{ title }} · Cornershop{% endblock %}
{% block content %}
  <div class="text-center py-5">
    <p class="display-5 text-muted mb-2">{{ status }}</p>
    <h1 class="h4">{{ title }}</h1>
    {% if status == 403 %}
      <p class="text-muted">Your account doesn't have access to this page.</p>
    {% endif %}
    <a href="/" class="btn btn-outline-primary mt-3">Back to the shop</a>
  </div>
{% endblock %}
